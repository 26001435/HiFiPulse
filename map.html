<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Speedtest Map Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <!-- PapaParse parses CSV lines directly inside browser -->
    <script src="https://cloudflare.com"></script>
    <style>
        #map { height: 600px; width: 100%; max-width: 1000px; margin: 20px auto; }
    </style>
</head>
<body>

    <h1 style="text-align:center;">Global Speed Test Markers</h1>
    <div id="map"></div>

    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSszY88R08y5xYR7Jn6MHz7o1qTPziFFDYhjbbfVfELPu9KxSj44IwRBk9x7zQvnckZ_FFLrFeTYZrw/pubhtml";
        
        // Initialize Map
        const map = L.map('map').setView([20, 0], 2); 
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Fetch CSV data from Google Sheets
        fetch(CSV_URL)
            .then(res => res.text())
            .then(csvText => {
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        plotMarkers(results.data);
                    }
                });
            });

        function plotMarkers(data) {
            data.forEach(row => {
                const lat = parseFloat(row["Latitude"]);
                const lon = parseFloat(row["Longitude"]);
                
                // Only plot if coordinates are available
                if (!isNaN(lat) && !isNaN(lon)) {
                    const popupContent = `
                        <b>Speed Test Result</b><br>
                        <b>Download:</b> ${row["Download (Mbps)"]} Mbps<br>
                        <b>Upload:</b> ${row["Upload (Mbps)"]} Mbps<br>
                        <b>Ping:</b> ${row["Ping (ms)"]} ms<br>
                        <small>Tested on: ${row["Timestamp"]}</small>
                    `;
                    L.marker([lat, lon]).addTo(map).bindPopup(popupContent);
                }
            });
        }

        function getMarkerColor(downloadSpeed) {
    const speed = parseFloat(downloadSpeed);
    if (speed >= 50) return '#10b981'; // Emerald Green
    if (speed >= 15) return '#f59e0b'; // Amber Orange
    return '#ef4444';                // Rose Red
}

function plotMarkers(data) {
    data.forEach(row => {
        const lat = parseFloat(row["Latitude"]);
        const lon = parseFloat(row["Longitude"]);
        const download = row["Download (Mbps)"];
        
        if (!isNaN(lat) && !isNaN(lon)) {
            const markerColor = getMarkerColor(download);
            
            // Create a sleek HTML/SVG pulse marker instead of default heavy PNG images
            const customIcon = L.divIcon({
                className: 'custom-pin',
                html: `<div style="
                    background-color: ${markerColor};
                    width: 14px;
                    height: 14px;
                    border-radius: 50%;
                    border: 2px solid #ffffff;
                    box-shadow: 0 0 8px rgba(0,0,0,0.5);
                "></div>`,
                iconSize:,
                iconAnchor: [7, 7]
            });

            const popupContent = `
                <div style="font-family: sans-serif; padding: 5px;">
                    <b style="font-size: 14px; color: #1f2937;">Speed Metrics</b><br>
                    <hr style="border: 0; border-top: 1px solid #e5e7eb; margin: 6px 0;">
                    <span style="color: ${markerColor}; font-weight: bold;">● Download:</span> ${download} Mbps<br>
                    <span style="color: #4b5563;">● Upload:</span> ${row["Upload (Mbps)"]} Mbps<br>
                    <span style="color: #4b5563;">● Ping:</span> ${row["Ping (ms)"]} ms<br>
                    <small style="color: #9ca3af; display:block; margin-top:8px;">Tested: ${row["Timestamp"]}</small>
                </div>
            `;
            
            L.marker([lat, lon], { icon: customIcon })
             .addTo(map)
             .bindPopup(popupContent);
        }
    });
}

    </script>
</body>
</html>
